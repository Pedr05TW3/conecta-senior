<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d3b66">
  <title>Criar Conta · ConectaSênior</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="artboard" id="criar-conta-conectasenior" aria-label="Criar Conta">
    <div class="canvas">
      <i class="shape header-bg" data-node-id="2003:177" aria-hidden="true"></i><i class="shape" data-node-id="2003:181" aria-hidden="true"></i><i class="shape" data-node-id="2003:184" aria-hidden="true"></i><i class="shape" data-node-id="2003:187" aria-hidden="true"></i><i class="shape" data-node-id="2003:190" aria-hidden="true"></i><i class="shape" data-node-id="2003:192" aria-hidden="true"></i><i class="shape button-shape" data-node-id="2003:194" aria-hidden="true"></i><h1 class="copy app-text app-page-title" data-node-id="2003:178">Criar uma conta</h1><p class="copy app-text" data-node-id="2003:179">Preencha seus dados para começar.</p><p class="copy app-text" data-node-id="2003:180">Nome completo</p><p class="copy app-text" data-node-id="2003:182"></p><p class="copy app-text" data-node-id="2003:183">E-mail</p><p class="copy app-text" data-node-id="2003:185"></p><p class="copy app-text" data-node-id="2003:186">Senha</p><p class="copy app-text" data-node-id="2003:188"></p><p class="copy app-text" data-node-id="2003:189">Você é</p><p class="copy app-text" data-node-id="2003:191">Pessoa idosa</p><p class="copy app-text" data-node-id="2003:193">Acompanhante</p><p class="copy app-text" data-node-id="2003:195"></p>
      <form class="signup-form">
        <label class="visually-hidden" for="signup-name">Nome completo</label>
        <input class="signup-input signup-name" id="signup-name" name="nome" type="text" placeholder="Como quer ser chamado?" autocomplete="name" >
        <label class="visually-hidden" for="signup-email">E-mail</label>
        <input class="signup-input signup-email" id="signup-email" name="email" type="email" placeholder="seuemail@exemplo.com" autocomplete="email" >
        <label class="visually-hidden" for="signup-password">Senha</label>
        <input class="signup-input signup-password" id="signup-password" name="senha" type="password" placeholder="Crie uma senha segura" autocomplete="new-password" minlength="8" >
        <fieldset class="profile-options" aria-label="Você é">
          <legend class="visually-hidden">Você é</legend>
          <label class="profile-option profile-senior"><input type="radio" name="perfil" value="idoso" ><span class="visually-hidden">Pessoa idosa</span></label>
          <label class="profile-option profile-companion"><input type="radio" name="perfil" value="acompanhante"><span class="visually-hidden">Acompanhante</span></label>
        </fieldset>
        <button class="signup-submit" href="/pages/login.html" type="submit">Criar conta</button>
        <button class="signup-cancel" href="/pages/login.html">Cancelar</button>
      </form>
    </div>
  </main>
  <script>
    document.querySelector('.signup-form').addEventListener('submit', (event) => {
      event.preventDefault();
      window.location.assign('/pages/login.html');
    });
  </script>
  <script src="/scripts/modo-prototipo.js" defer></script>
</body>
</html>
