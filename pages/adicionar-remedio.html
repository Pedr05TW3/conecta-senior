<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d3b66">
  <title>Adicionar Remedio · ConectaSênior</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="artboard" id="adicionar-remedio-conectasenior-2" aria-label="Adicionar Remedio">
    <div class="canvas">
      <i class="shape header-bg" data-node-id="2003:65" aria-hidden="true"></i><i class="shape button-shape" data-node-id="2003:68" aria-hidden="true"></i><i class="shape button-shape" data-node-id="2003:71" aria-hidden="true"></i><i class="shape button-shape" data-node-id="2003:74" aria-hidden="true"></i><i class="shape button-shape" data-node-id="2003:77" aria-hidden="true"></i><span class="copy" data-node-id="2003:66">Adicionar remédio</span><label class="copy" data-node-id="2003:67" for="remedy-name">Nome do remédio</label><label class="copy" data-node-id="2003:70" for="remedy-dosage">Dosagem</label><label class="copy" data-node-id="2003:73" for="remedy-time">Horário</label><label class="copy" data-node-id="2003:76" for="remedy-instructions">Orientação</label>
    <form id="remedy-form" class="remedy-form">
      <input class="remedy-field" data-node-id="2003:69" id="remedy-name" name="name" type="text" placeholder="Ex.: Losartana" autocomplete="off" required>
      <input class="remedy-field" data-node-id="2003:72" id="remedy-dosage" name="dosage" type="text" placeholder="Ex.: 50 mg" autocomplete="off" required>
      <input class="remedy-field" data-node-id="2003:75" id="remedy-time" name="time" type="time" value="09:00" required>
      <input class="remedy-field" data-node-id="2003:78" id="remedy-instructions" name="instructions" type="text" placeholder="Ex.: Após o café" autocomplete="off">
      <label class="remedy-duration-label" for="remedy-duration">Período de uso</label>
      <select class="remedy-duration-select" id="remedy-duration" name="duration" required>
        <option value="">Selecione o período</option>
        <option value="1-week">1 semana</option>
        <option value="2-weeks">2 semanas</option>
        <option value="1-month">1 mês</option>
        <option value="3-months">3 meses</option>
        <option value="6-months">6 meses</option>
        <option value="continuous">Uso contínuo</option>
      </select>
      <p class="remedy-form-message visually-hidden" id="remedy-form-message" role="status" aria-live="polite"></p>
      <div class="remedy-form-actions">
        <button class="remedy-save-button" type="submit">Salvar remédio</button>
        <a class="remedy-cancel-button" href="/pages/meus-remedios.html">Cancelar</a>
      </div>
    </form>
    </div>
  </main>
  <script src="/scripts/remedios.js" defer></script>
</body>
</html>
